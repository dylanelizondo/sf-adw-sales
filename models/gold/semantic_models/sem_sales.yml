version: 2

# dbt Semantic Layer (MetricFlow) equivalent of models/gold/semantic_views/gld_sv_sales.sql.
#
# Mapping from the Snowflake semantic view:
#   TABLES + PRIMARY KEY      -> semantic_models + primary entity
#   RELATIONSHIPS             -> foreign entity on the fact, same name as the dimension's primary entity
#   DIMENSIONS                -> dimensions (categorical / time)
#   FACTS + METRICS           -> measures + metrics (a metric is built on a measure)
#   WITH SYNONYMS             -> no equivalent in MetricFlow, folded into descriptions
#   AI_SQL_GENERATION etc.    -> no equivalent, stays in the Snowflake view
#
# Role-playing dimensions: address (bill_to / ship_to) uses entity roles.
# Dates are time dimensions on the fact; the calendar attributes of adw_core's gld_dim_date
# (weekday name, week of year...) are NOT modeled here, MetricFlow slices time by granularity
# (day, week, month, quarter, year) instead.
#
# Requires a time spine model (models.config.time_spine) in the project, see the note in the PR.

semantic_models:

  # ---------------------------------------------------------------------------
  # FACT
  # ---------------------------------------------------------------------------
  - name: order_lines
    description: "One row per sales order line, plus one charge row per order with tax or freight."
    model: ref('gld_fct_order_line')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order_line
        type: primary
        expr: order_lines_key
      - name: client
        type: foreign
        expr: customer_key
      - name: territory
        type: foreign
        expr: territory_key
      - name: address
        type: foreign
        role: bill_to
        expr: bill_to_address_key
      - name: address
        type: foreign
        role: ship_to
        expr: ship_to_address_key
      - name: sales_person
        type: foreign
        expr: sales_person_key
      - name: credit_card
        type: foreign
        expr: credit_card_key
      - name: order_profile
        type: foreign
        expr: order_profile_key
      - name: special_offer
        type: foreign
        expr: special_offer_key
      - name: ship_method
        type: foreign
        expr: ship_method_key
      - name: currency_rate
        type: foreign
        expr: currency_rate_key
      - name: product
        type: foreign
        expr: product_key
      - name: store
        type: foreign
        expr: store_key
      - name: sales_order
        type: natural
        expr: sales_order_id

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
        description: "Date the order was placed."
      - name: due_date
        type: time
        type_params:
          time_granularity: day
        description: "Date the order is due."
      - name: ship_date
        type: time
        type_params:
          time_granularity: day
        description: "Date the order shipped; NULL if not shipped yet."
      - name: sales_order_number
        type: categorical
        description: "Sales order number (order number, SO number)."
      - name: purchase_order_number
        type: categorical
        description: "Customer purchase order number."
      - name: is_order_charge
        type: categorical
        description: "TRUE for the tax and freight charge row of an order; FALSE for product lines."

    measures:
      - name: line_total_sum
        description: "Net amount of the order line after discount."
        agg: sum
        expr: line_total
      - name: order_qty_sum
        description: "Units sold on the order line."
        agg: sum
        expr: order_qty
      - name: gross_sales_sum
        description: "Quantity times list unit price, before discount."
        agg: sum
        expr: order_qty * unit_price
      - name: discount_sum
        description: "Quantity times unit price times discount fraction."
        agg: sum
        expr: order_qty * unit_price * unit_price_discount
      - name: tax_amt_sum
        description: "Order tax, only on charge rows."
        agg: sum
        expr: tax_amt
      - name: freight_sum
        description: "Order freight, only on charge rows."
        agg: sum
        expr: freight
      - name: order_count_distinct
        description: "Distinct sales orders."
        agg: count_distinct
        expr: sales_order_id
      - name: product_line_count
        description: "Product lines only; charge rows count as 0."
        agg: sum
        expr: case when is_order_charge = false then 1 else 0 end
      - name: unit_price_avg
        description: "Average list unit price per order line."
        agg: average
        expr: unit_price
      - name: customer_count_distinct
        description: "Distinct customers who ordered."
        agg: count_distinct
        expr: customer_key

  # ---------------------------------------------------------------------------
  # DIMENSIONS
  # ---------------------------------------------------------------------------
  - name: clients
    description: "Customers: individuals or resellers (stores)."
    model: ref('gld_dim_client')
    defaults:
      agg_time_dimension: client_modified_date
    entities:
      - name: client
        type: primary
        expr: client_key
    dimensions:
      - name: client_modified_date
        type: time
        type_params:
          time_granularity: day
      - name: client_name
        type: categorical
        description: "Customer name."
      - name: client_type
        type: categorical
        description: "INDIVIDUAL or STORE (UNKNOWN placeholders exist)."
      - name: client_age_band
        type: categorical
      - name: client_education
        type: categorical
      - name: client_occupation
        type: categorical
      - name: client_is_home_owner
        type: categorical
    measures:
      - name: client_total
        description: "Registered clients, individuals plus stores, whether or not they ordered."
        agg: count_distinct
        expr: case when client_type in ('INDIVIDUAL', 'STORE') then client_key end
      - name: individual_client_total
        agg: count_distinct
        expr: case when client_type = 'INDIVIDUAL' then client_key end
      - name: store_client_total
        agg: count_distinct
        expr: case when client_type = 'STORE' then client_key end

  - name: territories
    description: "Sales territories (regions)."
    model: ref('gld_dim_territory')
    entities:
      - name: territory
        type: primary
        expr: territory_key
    dimensions:
      - name: territory_name
        type: categorical
      - name: territory_group
        type: categorical
        description: "North America, Europe, Pacific."
      - name: country_region_code
        type: categorical

  - name: addresses
    description: "Addresses; plays the bill_to and ship_to roles on the fact."
    model: ref('gld_dim_address')
    entities:
      - name: address
        type: primary
        expr: address_key
    dimensions:
      - name: city
        type: categorical
      - name: state_province_name
        type: categorical
      - name: country_region_code
        type: categorical

  - name: sales_people
    description: "Salesperson who processed the sale (not the store account manager)."
    model: ref('gld_dim_sales_person')
    entities:
      - name: sales_person
        type: primary
        expr: sales_person_key
    dimensions:
      - name: sales_person_full_name
        type: categorical

  - name: payment_cards
    description: "Credit card used to pay the order."
    model: ref('gld_dim_credit_card')
    entities:
      - name: credit_card
        type: primary
        expr: credit_card_key
    dimensions:
      - name: card_type
        type: categorical

  - name: order_profiles
    description: "Order status, sales channel and shipped flag."
    model: ref('gld_dim_order_profile')
    entities:
      - name: order_profile
        type: primary
        expr: order_profile_key
    dimensions:
      - name: order_status_label
        type: categorical
      - name: order_channel
        type: categorical
        description: "online or offline."
      - name: is_shipped
        type: categorical

  - name: special_offers
    description: "Special offers (promotions) applied to order lines."
    model: ref('gld_dim_special_offer')
    entities:
      - name: special_offer
        type: primary
        expr: special_offer_key
    dimensions:
      - name: special_offer_description
        type: categorical
      - name: special_offer_type
        type: categorical
      - name: special_offer_category
        type: categorical

  - name: shipping_methods
    description: "Shipping methods (carriers)."
    model: ref('gld_dim_ship_method')
    entities:
      - name: ship_method
        type: primary
        expr: ship_method_key
    dimensions:
      - name: ship_method_name
        type: categorical

  - name: currency_rates
    description: "Currency exchange rates for orders not sold in local currency."
    model: ref('gld_dim_currency_rate')
    entities:
      - name: currency_rate
        type: primary
        expr: currency_rate_key
    dimensions:
      - name: from_currency_code
        type: categorical
      - name: to_currency_code
        type: categorical

  - name: products
    description: "Products sold (from the ADW_PRODUCTION project). Charge rows have no product."
    model: ref('ADW_PRODUCTION', 'gld_dim_product')
    entities:
      - name: product
        type: primary
        expr: product_key
    dimensions:
      - name: product_name
        type: categorical
      - name: product_number
        type: categorical
        description: "SKU."
      - name: category_name
        type: categorical
      - name: subcategory_name
        type: categorical
      - name: model_name
        type: categorical

  - name: stores
    description: >
      Reseller stores, Type 2 snapshot: one row per store version. The fact's store_key points at
      the version in force on the order date, so group by store_id plus store_name.
    model: ref('gld_dim_store')
    entities:
      - name: store
        type: primary
        expr: store_key
    dimensions:
      - name: store_id
        type: categorical
        description: "Stable store id, the same across all versions."
      - name: store_name
        type: categorical
      - name: store_business_type
        type: categorical
      - name: store_specialty
        type: categorical
      - name: store_year_opened
        type: categorical
      - name: store_square_feet
        type: categorical
      - name: store_number_employees
        type: categorical
      - name: store_account_manager
        type: categorical
        expr: sales_person_full_name
        description: "Salesperson assigned to manage the store. NOT the person who processed the sale."

# -----------------------------------------------------------------------------
# METRICS
# -----------------------------------------------------------------------------
metrics:
  - name: total_sales
    label: Total sales
    description: "Net sales (revenue): sum of line totals after discount. Excludes tax and freight."
    type: simple
    type_params:
      measure: line_total_sum

  - name: total_quantity
    label: Total quantity
    description: "Units sold."
    type: simple
    type_params:
      measure: order_qty_sum

  - name: gross_sales
    label: Gross sales
    description: "Sales before discount: quantity times list unit price."
    type: simple
    type_params:
      measure: gross_sales_sum

  - name: total_discount
    label: Total discount
    description: "Discount given: quantity times unit price times discount fraction."
    type: simple
    type_params:
      measure: discount_sum

  - name: total_tax
    label: Total tax
    type: simple
    type_params:
      measure: tax_amt_sum

  - name: total_freight
    label: Total freight
    type: simple
    type_params:
      measure: freight_sum

  - name: order_count
    label: Order count
    description: "Number of distinct sales orders."
    type: simple
    type_params:
      measure: order_count_distinct

  - name: line_count
    label: Line count
    description: "Number of product order lines. Excludes tax and freight charge rows."
    type: simple
    type_params:
      measure: product_line_count

  - name: average_unit_price
    label: Average unit price
    type: simple
    type_params:
      measure: unit_price_avg

  - name: customer_count
    label: Customer count
    description: "Distinct customers who ordered."
    type: simple
    type_params:
      measure: customer_count_distinct

  - name: client_count
    label: Client count
    description: "Registered clients (individuals plus stores), ordered or not. Do not combine with order, date or product dimensions."
    type: simple
    type_params:
      measure: client_total

  - name: individual_client_count
    label: Individual client count
    type: simple
    type_params:
      measure: individual_client_total

  - name: store_client_count
    label: Store client count
    type: simple
    type_params:
      measure: store_client_total
