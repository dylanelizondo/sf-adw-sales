version: 2

models:
  - name: dim_client
    description: >
        Gold dimension of AdventureWorks clients. One row per customer, equal to
        brz_adventure_works_sales__customer. A plain select over bronze with no joins: it carries
        the customer keys, the account number, the three foreign keys and the modified date. The
        client name, client type and individual attributes are not part of it; they need joins and
        belong to silver. Join dim_orders on customer_id and dim_store on store_id.

    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["mlara"]
            ownerGroups: ["sales_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # dim_client

            Gold dimension of AdventureWorks clients. One row per customer, equal to brz_adventure_works_sales__customer. A plain select over bronze with no joins: it carries the customer keys, the account number, the three foreign keys and the modified date. The client name, client type and individual attributes are not part of it; they need joins and belong to silver. Join dim_orders on customer_id and dim_store on store_id.

            **Layer:** gold
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | CLIENT_SK | Sequential integer key, row_number ordered by customer_id. A view recomputes it on every query, so it stays stable while customers are only added at the end; it is not a stored autoincrement. Join on client_key or customer_id when stability matters. |
            | CLIENT_KEY | PK. Surrogate key, md5 of the customer id, built like the silver customer_key so both layers give the same value. |
            | CUSTOMER_ID | Natural key. Unique identifier of the customer in the source system; the column dim_orders joins on. |
            | CLIENT_ACCOUNT_NUMBER | Customer account number, derived in the source system. Surfaced as-is; issue #34 flags it as ambiguous, so do not use it as a key. Not the order account number carried by dim_orders. |
            | STORE_ID | FK to dim_store (business_entity_id). Set when the client is a reseller store, null for individuals. |
            | PERSON_ID | FK to the person behind an individual customer. Null for store-only customers. |
            | TERRITORY_ID | FK to the sales territory the client belongs to. Will join to dim_territory once #26 is built. |
            | CLIENT_MODIFIED_DATE | Last change to the customer record in the source system, cast from text to a timestamp. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-sales, not this README._

    columns:

      # --- keys ------------------------------------------------------------
      - name: client_sk
        description: "Sequential integer key, row_number ordered by customer_id. A view recomputes it on every query, so it stays stable while customers are only added at the end; it is not a stored autoincrement. Join on client_key or customer_id when stability matters."
        data_tests:
          - unique
          - not_null

      - name: client_key
        description: "PK. Surrogate key, md5 of the customer id, built like the silver customer_key so both layers give the same value."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Natural key. Unique identifier of the customer in the source system; the column dim_orders joins on."
        data_tests:
          - unique
          - not_null

      # --- client --------------------------------------------------------------
      - name: client_account_number
        description: "Customer account number, derived in the source system. Surfaced as-is; issue #34 flags it as ambiguous, so do not use it as a key. Not the order account number carried by dim_orders."

      # --- foreign keys ------------------------------------------------------------
      - name: store_id
        description: "FK to dim_store (business_entity_id). Set when the client is a reseller store, null for individuals."
        data_tests:
          - relationships:
              arguments:
                to: ref('adw_core', 'brz_adventure_works_sales__store')
                field: business_entity_id

      - name: person_id
        description: "FK to the person behind an individual customer. Null for store-only customers."
        data_tests:
          - relationships:
              arguments:
                to: ref('adw_core', 'brz_adventure_works_person__person')
                field: business_entity_id

      - name: territory_id
        description: "FK to the sales territory the client belongs to. Will join to dim_territory once #26 is built."
        data_tests:
          - relationships:
              arguments:
                to: ref('adw_core', 'brz_adventure_works_sales__sales_territory')
                field: territory_id

      # --- audit -------------------------------------------------------------
      - name: client_modified_date
        description: "Last change to the customer record in the source system, cast from text to a timestamp."
