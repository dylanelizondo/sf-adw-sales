version: 2

models:
  - name: gld_fct_order_header
    description: >
        Gold fact of AdventureWorks sales orders, at order-header grain. One row per order
        (equal to slv_dim_adventure_works_sales__sales_order_header_join_detail), reflecting
        only the current state of each order. Straight select from the silver model, which
        already joins the order header to its aggregated line metrics (line count, units,
        revenue) straight from bronze. Gold adds nothing but the surrogate key: sales_order_id
        is the natural key and is used as-is.

        Star schema: FKs point only at conformed gold dimensions (dim_client, dim_territory,
        dim_address, dim_sales_person, dim_credit_card). ship_method_id and currency_rate_id
        are still degenerate dimensions -- no gold dimension exists for shipping method or
        currency rate yet, so they stay as plain attributes rather than FKs. Was previously
        (mis)modeled as gld_dim_orders; it carries additive measures (sub_total, total_due,
        order_total_revenue, ...), which makes it a fact, not a dimension.

        Type 1: incrementally merged on sales_order_id, so a changed order overwrites its
        existing row in place and no history is kept. Incremental runs re-select only orders
        modified since the last run (watermarked on order_modified_date).

    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["calfarol"]
            ownerGroups: ["sales_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # fct_order_header

            Gold fact of AdventureWorks sales orders, at order-header grain. One row per order (equal to slv_dim_adventure_works_sales__sales_order_header_join_detail), reflecting only the current state of each order. Straight select from the silver model, which already joins the order header to its aggregated line metrics (line count, units, revenue) straight from bronze. Gold adds nothing but the surrogate key: sales_order_id is the natural key and is used as-is.

            Star schema: FKs point only at conformed gold dimensions (dim_client, dim_territory, dim_address, dim_sales_person, dim_credit_card). ship_method_id and currency_rate_id are still degenerate dimensions -- no gold dimension exists for shipping method or currency rate yet.

            Type 1: incrementally merged on sales_order_id, so a changed order overwrites its existing row in place and no history is kept. Incremental runs re-select only orders modified since the last run.

            **Layer:** gold
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | ORDER_KEY | PK. Surrogate key minted in gold with dbt_utils.generate_surrogate_key over sales_order_id. |
            | SALES_ORDER_ID | Natural key, recovered from the corrupted bronze column in silver. |
            | SALES_ORDER_NUMBER | Order number shown to the customer. |
            | PURCHASE_ORDER_NUMBER | Purchase order number the customer assigned. |
            | ACCOUNT_NUMBER | Accounting account number tied to the sale. |
            | REVISION_NUMBER | Revision number of the document. |
            | ORDER_DATE | Date the order was placed. |
            | DUE_DATE | Date the delivery was promised for. |
            | SHIP_DATE | Date the order shipped. Null while it has not shipped. |
            | IS_SHIPPED | True when ship_date is not null. |
            | ORDER_STATUS_CODE | Original status: 1 to 6. |
            | ORDER_STATUS_LABEL | Decoded status. |
            | IS_ONLINE_ORDER | True when placed online. |
            | ORDER_CHANNEL | Online or Salesperson. |
            | CUSTOMER_ID | FK to dim_client. |
            | TERRITORY_ID | FK to dim_territory. |
            | BILL_TO_ADDRESS_ID | FK to dim_address. |
            | SHIP_TO_ADDRESS_ID | FK to dim_address. |
            | SALES_PERSON_ID | FK to dim_sales_person. Null for online orders. |
            | SHIP_METHOD_ID | Degenerate dimension. No gold dimension built for shipping methods yet. |
            | CREDIT_CARD_ID | FK to dim_credit_card. Null when no card was used. |
            | CURRENCY_RATE_ID | Degenerate dimension. Null for local currency. No gold dimension built for currency rates yet. |
            | SUB_TOTAL | Subtotal before tax and freight. |
            | TAX_AMT | Tax amount charged. |
            | FREIGHT | Freight cost charged. |
            | TOTAL_DUE | Total amount due. |
            | ORDER_LINE_COUNT | Number of order lines. 0 when the order has none. |
            | ORDER_TOTAL_QTY | Units ordered across all lines. |
            | ORDER_TOTAL_REVENUE | Sum of line_total across all lines. |
            | ORDER_MODIFIED_DATE | Last change to the order in the source system. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-sales, not this README._

    columns:

      # --- keys ------------------------------------------------------------
      - name: order_key
        description: "PK. Surrogate key minted in gold with dbt_utils.generate_surrogate_key over sales_order_id."
        data_tests:
          - unique
          - not_null

      - name: sales_order_id
        description: "Natural key, recovered from the corrupted bronze column in silver. Merge key of the incremental model."
        data_tests:
          - unique
          - not_null

      # --- identifiers -------------------------------------------------------
      - name: sales_order_number
        description: "Sales order number shown to the customer."

      - name: purchase_order_number
        description: "Purchase order number the customer assigned to the sale. Null for most online orders."

      - name: account_number
        description: "Accounting account number tied to the sale."

      - name: revision_number
        description: "Revision number of the document. Incremented on every change."

      # --- dates ---------------------------------------------------------------
      - name: order_date
        description: "Date the order was placed."

      - name: due_date
        description: "Date the delivery was promised for."

      - name: ship_date
        description: "Date the order shipped. Null while it has not shipped."

      - name: is_shipped
        description: "True when ship_date is not null."

      # --- status and channel ----------------------------------------------------
      - name: order_status_code
        description: "Original order status: 1 in process, 2 approved, 3 backordered, 4 rejected, 5 shipped, 6 cancelled."

      - name: order_status_label
        description: "Human-readable order status, decoded in silver from order_status_code."

      - name: is_online_order
        description: "True when the order was placed online, false when a salesperson placed it."

      - name: order_channel
        description: "Sales channel, Online or Salesperson, decoded in silver."

      # --- foreign keys to conformed dimensions -----------------------------------
      - name: customer_id
        description: "FK to dim_client."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_client')
                field: customer_id

      - name: territory_id
        description: "FK to dim_territory."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_territory')
                field: territory_id

      - name: bill_to_address_id
        description: "FK to dim_address."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_address')
                field: address_id

      - name: ship_to_address_id
        description: "FK to dim_address."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_address')
                field: address_id

      - name: sales_person_id
        description: "FK to dim_sales_person. Null for online orders."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_sales_person')
                field: business_entity_id

      - name: credit_card_id
        description: "FK to dim_credit_card. Null when no card was used."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_credit_card')
                field: credit_card_id

      # --- degenerate dimensions (no gold dimension built for these yet) ----------
      - name: ship_method_id
        description: "Degenerate dimension. Shipping method's natural key, carried as a plain attribute since no gold dimension exists for shipping methods yet."

      - name: currency_rate_id
        description: "Degenerate dimension. Exchange rate's natural key, carried as a plain attribute since no gold dimension exists for currency rates yet. Null for sales in local currency."

      # --- amounts -----------------------------------------------------------------
      - name: sub_total
        description: "Order subtotal before tax and freight."

      - name: tax_amt
        description: "Tax amount charged on the order."

      - name: freight
        description: "Freight cost charged on the order."

      - name: total_due
        description: "Total amount due on the order (subtotal + tax + freight)."

      # --- order-level line metrics ----------------------------------------------------
      - name: order_line_count
        description: "Number of lines for this order from bronze sales_order_detail. 0 when the order has none."

      - name: order_total_qty
        description: "Units ordered across all lines of the order."

      - name: order_total_revenue
        description: "Sum of line_total across all lines of the order."

      # --- audit -------------------------------------------------------------------
      - name: order_modified_date
        description: "Last change to the order in the source system."
