version: 2

models:
  - name: gld_dim_client
    description: >
        Gold dimension of AdventureWorks clients. One row per customer (19,820, equal to
        slv_adventure_works_sales__customer) plus the 2 default rows (-1 Missing, -2 Not
        Applicable) added by upsert_default_rows in the post_hook, so facts with an unknown
        client still join. On those two rows client_type is UNKNOWN, store_id is -1/-2
        (resolving against dim_store's own default rows), person_id is null (no gold person
        model and no default row to join to), and every other column -- including the
        personal-attribute columns -- carries upsert_default_rows' generic by-type default
        rather than a null.
        client_key is an auto-incrementing surrogate
        key minted HERE, since silver carries no key of its own. Adds the
        client's display name: the store name for reseller stores and the person's full name for
        individual customers. Individual clients also carry a few non-sensitive self-reported
        attributes from adw_core's slv_adventure_works_person__person (age band, education, occupation, children, cars,
        home ownership); stores never do. Email, phone and the sensitive survey answers (gender,
        marital status, income band) are deliberately left out.

        Star schema: carries exactly one dimension-to-dimension FK, store_id -> dim_store --
        an outrigger, accepted here because dim_store has its own Type 2 history that this
        Type 1 dimension must not duplicate or freeze a stale copy of. Store descriptive
        attributes (business type, specialty, annual sales/revenue, assigned salesperson, ...)
        live only in dim_store; join there via store_id rather than expecting them on this
        row. territory_id and primary_address_id were dropped on purpose -- those belong to
        the order (fact), not to the client. Join fct_order_header on customer_id for
        territory/address context.

    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["mlara"]
            ownerGroups: ["sales_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # dim_client

            Gold dimension of AdventureWorks clients. One row per customer (19,820, equal to slv_adventure_works_sales__customer). client_key is an auto-incrementing surrogate key minted here, since silver carries no key of its own. Adds the client's display name: the store name for reseller stores and the person's full name for individual customers. Individual clients also carry a few non-sensitive self-reported attributes from adw_core's slv_adventure_works_person__person (age band, education, occupation, children, cars, home ownership); stores never do. Email, phone and the sensitive survey answers (gender, marital status, income band) are deliberately left out.

            Star schema: carries exactly one dimension-to-dimension FK, store_id -> dim_store (an outrigger, accepted because dim_store carries its own Type 2 history this Type 1 dimension must not duplicate). Store attributes (business type, specialty, annual sales/revenue, assigned salesperson, ...) live only in dim_store -- join there via store_id. territory_id and primary_address_id were dropped on purpose -- those belong to the order (fact), not to the client. Join fct_order_header on customer_id for territory/address context.

            **Layer:** gold
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | CLIENT_KEY | PK. Auto-incrementing surrogate key minted here (silver carries no key of its own). |
            | CUSTOMER_ID | Natural key. Unique identifier of the customer in the source system; the column fct_order_header joins on. |
            | CLIENT_TYPE | Client classification from silver. INDIVIDUAL when only a person is set, STORE when a store is set (a store wins over a person for the 635 ambiguous rows), UNKNOWN when neither is set. |
            | CLIENT_NAME | Display name: the store name for STORE clients, the person's full name for INDIVIDUAL clients, 'Unknown' when neither is available (the dim_client__every_client_has_a_name test fails if that happens). Contains personal names for individuals. |
            | CLIENT_ACCOUNT_NUMBER | Customer account number, derived in the source system. Surfaced as-is; issue #34 flags it as ambiguous, so do not use it as a key. Not the order account number carried by fct_order_header. |
            | CLIENT_HAS_DEMOGRAPHICS_SURVEY | True when the individual's survey holds real answers rather than an empty form. Null for stores. |
            | CLIENT_AGE_BAND | Banded age derived from the survey birth date; the raw birth date is not exposed. Self-reported. Individuals with a survey only. |
            | CLIENT_EDUCATION | Highest education band reached, from Partial High School to Graduate Degree. Self-reported. |
            | CLIENT_EDUCATION_SORT | Display order for client_education, 1 to 5. |
            | CLIENT_OCCUPATION | Occupation category: Clerical, Manual, Skilled Manual, Professional or Management. Self-reported. |
            | CLIENT_TOTAL_CHILDREN | Total number of children. Self-reported. |
            | CLIENT_NUMBER_CARS_OWNED | Number of cars owned. Self-reported. |
            | CLIENT_IS_HOME_OWNER | Home ownership. Self-reported. |
            | STORE_ID | FK to dim_store (business_entity_id). Set when the client is a reseller store, null for individuals. -1 and -2 on the two default rows resolve against dim_store's own default rows. Outrigger: join dim_store for store attributes (business type, specialty, annual sales, assigned salesperson, ...). |
            | PERSON_ID | Reference to the person behind an individual customer (business_entity_id in adw_core's slv_adventure_works_person__person). No gold person dimension exists, so this is a plain attribute, not a relationship. Null for store-only customers. |
            | CLIENT_MODIFIED_DATE | Last change to the customer record in the source system. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-sales, not this README._

    columns:

      # --- keys ------------------------------------------------------------
      - name: client_key
        description: "PK. Auto-incrementing surrogate key minted here (silver carries no key of its own)."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Natural key. Unique identifier of the customer in the source system; the column fct_order_header joins on."
        data_tests:
          - unique
          - not_null

      # --- client --------------------------------------------------------------
      - name: client_type
        description: "Client classification from silver. INDIVIDUAL when only a person is set, STORE when a store is set (a store wins over a person for the 635 ambiguous rows), UNKNOWN when neither is set."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["INDIVIDUAL", "STORE", "UNKNOWN"]

      - name: client_name
        description: "Display name: the store name for STORE clients, the person's full name for INDIVIDUAL clients, 'Unknown' when neither is available (the dim_client__every_client_has_a_name test fails if that happens). Contains personal names for individuals."

      - name: client_account_number
        description: "Customer account number, derived in the source system. Surfaced as-is; issue #34 flags it as ambiguous, so do not use it as a key. Not the order account number carried by fct_order_header."

      # --- individual clients only (null for stores) ---------------------------------
      - name: client_has_demographics_survey
        description: "True when the individual's survey holds real answers rather than an empty form. Null for stores."

      - name: client_age_band
        description: "Banded age derived from the survey birth date; the raw birth date is not exposed. Self-reported. Individuals with a survey only."

      - name: client_education
        description: "Highest education band reached, from Partial High School to Graduate Degree. Self-reported."

      - name: client_education_sort
        description: "Display order for client_education, 1 to 5."

      - name: client_occupation
        description: "Occupation category: Clerical, Manual, Skilled Manual, Professional or Management. Self-reported."

      - name: client_total_children
        description: "Total number of children. Self-reported."

      - name: client_number_cars_owned
        description: "Number of cars owned. Self-reported."

      - name: client_is_home_owner
        description: "Home ownership. Self-reported."

      # --- outrigger / plain reference ----------------------------------------
      - name: store_id
        description: "FK to dim_store (business_entity_id). Set when the client is a reseller store, null for individuals. -1 and -2 on the two default rows resolve against dim_store's own default rows. Outrigger: dim_store's descriptive attributes (business type, specialty, annual sales, assigned salesperson, ...) are not duplicated here -- join dim_store directly for them."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_store')
                field: store_id

      - name: person_id
        description: "Reference to the person behind an individual customer (business_entity_id in adw_core's slv_adventure_works_person__person). Null for store-only customers, and on the two default rows -- adw_core's person model carries no -1/-2 default of its own. No gold person dimension exists, so this is kept as a plain attribute, not a relationship."
        data_tests:
          - relationships:
              arguments:
                to: ref('adw_core', 'slv_adventure_works_person__person')
                field: business_entity_id

      # --- audit -------------------------------------------------------------
      - name: client_modified_date
        description: "Last change to the customer record in the source system."
