version: 2

models:
  - name: gld_dim_client
    description: >
        Gold dimension of AdventureWorks clients. One row per customer (19,820, equal to
        slv_adventure_works_sales__customer) plus the 2 default rows (-1 Missing, -2 Not
        Applicable) added by upsert_default_rows in the post_hook, so facts with an unknown
        client still join. On those two rows client_type is UNKNOWN, store_id/territory_id
        are -1/-2 (resolving against dim_store/dim_territory's own default rows), person_id
        and primary_address_id are null (no gold person model and no default row to join
        to), and every other column -- including the personal-attribute columns -- carries
        upsert_default_rows' generic by-type default rather than a null.
        client_key is an auto-incrementing surrogate
        key minted HERE, since silver carries no key of its own. Adds the
        client's display name: the store name for reseller stores and the person's full name for
        individual customers. Individual clients also carry a few non-sensitive self-reported
        attributes from adw_core's slv_adventure_works_person__person (age band, education, occupation, children, cars,
        home ownership); stores never do. Email, phone and the sensitive survey answers (gender,
        marital status, income band) are deliberately left out. Join dim_orders on customer_id and
        dim_store on store_id; store details live in dim_store.

    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["mlara"]
            ownerGroups: ["sales_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # dim_client

            Gold dimension of AdventureWorks clients. One row per customer (19,820, equal to slv_adventure_works_sales__customer). client_key is an auto-incrementing surrogate key minted here, since silver carries no key of its own. Adds the client's display name: the store name for reseller stores and the person's full name for individual customers. Individual clients also carry a few non-sensitive self-reported attributes from adw_core's slv_adventure_works_person__person (age band, education, occupation, children, cars, home ownership); stores never do. Email, phone and the sensitive survey answers (gender, marital status, income band) are deliberately left out. Join dim_orders on customer_id and dim_store on store_id; store details live in dim_store.

            **Layer:** gold
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | CLIENT_KEY | PK. Auto-incrementing surrogate key minted here (silver carries no key of its own). |
            | CUSTOMER_ID | Natural key. Unique identifier of the customer in the source system; the column dim_orders joins on. |
            | CLIENT_TYPE | Client classification from silver. INDIVIDUAL when only a person is set, STORE when a store is set (a store wins over a person for the 635 ambiguous rows), UNKNOWN when neither is set. |
            | CLIENT_NAME | Display name: the store name for STORE clients, the person's full name for INDIVIDUAL clients, 'Unknown' when neither is available (the dim_client__every_client_has_a_name test fails if that happens). Contains personal names for individuals. |
            | CLIENT_ACCOUNT_NUMBER | Customer account number, derived in the source system. Surfaced as-is; issue #34 flags it as ambiguous, so do not use it as a key. Not the order account number carried by dim_orders. |
            | CLIENT_HAS_DEMOGRAPHICS_SURVEY | True when the individual's survey holds real answers rather than an empty form. Null for stores. |
            | CLIENT_AGE_BAND | Banded age derived from the survey birth date; the raw birth date is not exposed. Self-reported. Individuals with a survey only. |
            | CLIENT_EDUCATION | Highest education band reached, from Partial High School to Graduate Degree. Self-reported. |
            | CLIENT_EDUCATION_SORT | Display order for client_education, 1 to 5. |
            | CLIENT_OCCUPATION | Occupation category: Clerical, Manual, Skilled Manual, Professional or Management. Self-reported. |
            | CLIENT_TOTAL_CHILDREN | Total number of children. Self-reported. |
            | CLIENT_NUMBER_CARS_OWNED | Number of cars owned. Self-reported. |
            | CLIENT_IS_HOME_OWNER | Home ownership. Self-reported. |
            | STORE_ID | FK to dim_store (business_entity_id). Set when the client is a reseller store, null for individuals. |
            | PERSON_ID | FK to the person behind an individual customer (business_entity_id in adw_core's slv_adventure_works_person__person). Null for store-only customers. |
            | TERRITORY_ID | FK to dim_territory. |
            | PRIMARY_ADDRESS_ID | FK to dim_address, taken from slv_adventure_works_person__person. Individual clients only; null for stores and for people with no address. |
            | CLIENT_MODIFIED_DATE | Last change to the customer record in the source system. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-sales, not this README._

    columns:

      # --- keys ------------------------------------------------------------
      - name: client_key
        description: "PK. Auto-incrementing surrogate key minted here (silver carries no key of its own)."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Natural key. Unique identifier of the customer in the source system; the column dim_orders joins on."
        data_tests:
          - unique
          - not_null

      # --- client --------------------------------------------------------------
      - name: client_type
        description: "Client classification from silver. INDIVIDUAL when only a person is set, STORE when a store is set (a store wins over a person for the 635 ambiguous rows), UNKNOWN when neither is set."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["INDIVIDUAL", "STORE", "UNKNOWN"]

      - name: client_name
        description: "Display name: the store name for STORE clients, the person's full name for INDIVIDUAL clients, 'Unknown' when neither is available (the dim_client__every_client_has_a_name test fails if that happens). Contains personal names for individuals."

      - name: client_account_number
        description: "Customer account number, derived in the source system. Surfaced as-is; issue #34 flags it as ambiguous, so do not use it as a key. Not the order account number carried by dim_orders."

      # --- individual clients only (null for stores) ---------------------------------
      - name: client_has_demographics_survey
        description: "True when the individual's survey holds real answers rather than an empty form. Null for stores."

      - name: client_age_band
        description: "Banded age derived from the survey birth date; the raw birth date is not exposed. Self-reported. Individuals with a survey only."

      - name: client_education
        description: "Highest education band reached, from Partial High School to Graduate Degree. Self-reported."

      - name: client_education_sort
        description: "Display order for client_education, 1 to 5."

      - name: client_occupation
        description: "Occupation category: Clerical, Manual, Skilled Manual, Professional or Management. Self-reported."

      - name: client_total_children
        description: "Total number of children. Self-reported."

      - name: client_number_cars_owned
        description: "Number of cars owned. Self-reported."

      - name: client_is_home_owner
        description: "Home ownership. Self-reported."

      # --- foreign keys ------------------------------------------------------------
      - name: store_id
        description: "FK to dim_store (business_entity_id). Set when the client is a reseller store, null for individuals. -1 and -2 on the two default rows resolve against dim_store's own default rows."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_store')
                field: store_id

      - name: person_id
        description: "FK to the person behind an individual customer (business_entity_id in adw_core's slv_adventure_works_person__person). Null for store-only customers, and on the two default rows -- adw_core's person model carries no -1/-2 default of its own."
        data_tests:
          - relationships:
              arguments:
                to: ref('adw_core', 'slv_adventure_works_person__person')
                field: business_entity_id

      - name: territory_id
        description: "FK to dim_territory (territory_id). -1 and -2 on the two default rows resolve against dim_territory's own default rows."
        data_tests:
          - relationships:
              arguments:
                to: ref('gld_dim_territory')
                field: territory_id

      - name: primary_address_id
        description: "FK to dim_address (address_id), taken from slv_adventure_works_person__person. Individual clients only; null for stores, for people with no address, and on the two default rows."

      # --- audit -------------------------------------------------------------
      - name: client_modified_date
        description: "Last change to the customer record in the source system."
