version: 2

models:
  - name: dim_territory
    description: >
        Gold dimension of AdventureWorks sales territories. One row per territory (10,
        equal to slv_adventure_works_sales__sales_territory). Uses the natural TERRITORY_ID
        as the dimension key since silver does not mint a surrogate. The *_YTD / *_LAST_YEAR
        snapshot columns are intentionally excluded — flagged in silver as not reliable
        for use as a gold metric.

    columns:

      # --- keys ------------------------------------------------------------
      - name: territory_key
        description: "PK. Same value as territory_id — silver does not mint a surrogate key for this table."
        data_tests:
          - unique
          - not_null

      - name: territory_id
        description: "Natural key. territory_id of SALES.SALES_TERRITORY."
        data_tests:
          - unique
          - not_null

      # --- territory ---------------------------------------------------------
      - name: territory_name
        description: "Name of the sales territory."
        data_tests: [not_null]

      - name: country_region_code
        description: "ISO country/region code for the territory."
        data_tests: [not_null]

      - name: territory_group
        description: "Geographic group this territory belongs to (Europe, North America, Pacific)."

      # --- audit ---------------------------------------------------------------
      - name: territory_modified_date
        description: "Last change to the territory in the source system."