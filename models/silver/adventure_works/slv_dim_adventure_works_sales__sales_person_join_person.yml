version: 2

models:
  - name: slv_dim_adventure_works_sales__sales_person_join_person
    description: >
        Salespeople with their display name already resolved. One row per salesperson (equal to
        slv_adventure_works_sales__sales_person, 17 in the repo documentation). Left joins adw_core's
        slv_adventure_works_person__person on business_entity_id so gld_dim_sales_person needs no
        JOINs; a salesperson without a person row is kept with a null name. No surrogate key is
        minted here, gold mints its own. Built as STG_DIM_SALES_PERSON_JOIN_PERSON in Snowflake.

    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["calfarol"]
            ownerGroups: ["sales_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # slv_dim_adventure_works_sales__sales_person_join_person

            Salespeople with their display name already resolved. One row per salesperson (equal to slv_adventure_works_sales__sales_person). Left joins adw_core's slv_adventure_works_person__person on business_entity_id so gld_dim_sales_person needs no JOINs; a salesperson without a person row is kept with a null name. No surrogate key is minted here, gold mints its own.

            **Layer:** silver
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | PK. Natural key. Identifier of the salesperson, FK to PERSON.BUSINESS_ENTITY. |
            | SALES_PERSON_FULL_NAME | Display name of the salesperson, from adw_core slv_adventure_works_person__person. Contains PII. |
            | TERRITORY_ID | FK to the sales territory assigned to the salesperson. Null for sales managers with no territory. |
            | SALES_QUOTA | Sales quota assigned to the salesperson. Null when none is assigned. |
            | BONUS | Bonus amount earned by the salesperson. |
            | COMMISSION_PCT | Commission percentage rate of the salesperson. |
            | SALES_YTD | Year-to-date sales total, a pre-aggregated source snapshot. Not additive. |
            | SALES_LAST_YEAR | Prior year sales total, a pre-aggregated source snapshot. Not additive. |
            | SALES_PERSON_MODIFIED_DATE | Last change to the salesperson in the source system. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-sales, not this README._

    columns:

      # --- keys ------------------------------------------------------------
      - name: business_entity_id
        description: "Natural key. Identifier of the salesperson (PK of SALES.SALES_PERSON, FK to PERSON.BUSINESS_ENTITY)."
        data_tests:
          - unique
          - not_null

      # --- identity ----------------------------------------------------------
      - name: sales_person_full_name
        description: "Display name of the salesperson, from adw_core slv_adventure_works_person__person. Null if no person row matches. Contains PII."
        config:
          meta: { contains_pii: true }

      # --- assignment and targets ----------------------------------------------
      - name: territory_id
        description: "FK to the sales territory assigned to the salesperson. Null for sales managers with no territory."

      - name: sales_quota
        description: "Sales quota assigned to the salesperson. Null when none is assigned; intentionally not zero-filled."

      - name: bonus
        description: "Bonus amount earned by the salesperson."

      - name: commission_pct
        description: "Commission percentage rate of the salesperson."

      # --- pre-aggregated source totals ----------------------------------------
      - name: sales_ytd
        description: "Year-to-date sales total, a pre-aggregated snapshot from the source. Not additive: do not use as a live metric."

      - name: sales_last_year
        description: "Prior year sales total, a pre-aggregated snapshot from the source. Not additive: do not use as a live metric."

      # --- audit -------------------------------------------------------------------
      - name: sales_person_modified_date
        description: "Last change to the salesperson in the source system."
