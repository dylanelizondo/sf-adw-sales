version: 2

models:
  - name: slv_adventure_works_sales__person_credit_card
    description: "Silver model for PERSON_CREDIT_CARD. Bridge table linking people to their credit cards."
    columns:
      - name: business_entity_id
        description: "Foreign key to the person who owns this credit card."
        tests:
          - not_null

      - name: credit_card_id
        description: "Foreign key to the credit card."
        tests:
          - not_null

      - name: modified_date
        description: "Last modification date of the original record, cast to DATE type."

      - name: _loaded_at
        description: "Timestamp of when this row was loaded into the silver layer."

      - name: _source_relation
        description: "Source table this record was loaded from."

    tests:
      - unique:
          arguments:
            column_name: "concat(business_entity_id, '-', credit_card_id)"