version: 2

models:
  - name: slv_adventure_works_sales__sales_order_header_sales_reason
    description: "Silver bridge model between sales order headers and sales reasons. Cleans corrupted composite keys and standardizes data types. An order may be associated with multiple reasons. Grain: one row per sales_order_id and sales_reason_id combination."
    columns:
      - name: sales_order_id
        description: "Part of composite primary key. Foreign key to the sales order header."
        data_type: "NUMBER(38,0)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_adventure_works_sales__sales_order_header')
                field: sales_order_id

      - name: sales_reason_id
        description: "Part of composite primary key. Foreign key to the sales reason lookup."
        data_type: "NUMBER(38,0)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('adw_core', 'brz_adventure_works_sales__sales_reason')
                field: sales_reason_id

      - name: modified_date
        description: "Last modification date of the record in source system, cast to DATE."
        data_type: "DATE"

      - name: _loaded_at
        description: "Audit timestamp of when this row was processed and loaded into the silver layer."
        data_type: "TIMESTAMP_LTZ"

      - name: _source_relation
        description: "Source table reference path for data lineage tracking."
        data_type: "VARCHAR"
