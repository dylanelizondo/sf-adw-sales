name: 'adw_sales'
version: '1.0.0'
config-version: 2

# Nombre del profile. dbt Cloud lo IGNORA (la conexion la toma del environment),
# pero conviene que coincida con el proyecto para cuando corras dbt local o en CI.
profile: 'adw_sales'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# ---------------------------------------------------------------------------
# Una variable de entorno por CAPA. El valor cambia por environment en dbt Cloud:
#
#   Variable              Project default    UAT                Production
#   DBT_DB_ADW_BRONZE     ADW_BRONZE_DEV     ADW_BRONZE_UAT     ADW_BRONZE_PROD
#   DBT_DB_ADW_SILVER     ADW_SILVER_DEV     ADW_SILVER_UAT     ADW_SILVER_PROD
#   DBT_DB_ADW_GOLD       ADW_GOLD_DEV       ADW_GOLD_UAT       ADW_GOLD_PROD
#
# A proposito NO llevan valor default en env_var(): si a un job le falta la
# variable, preferimos que falle en el parseo antes que escribir en DEV
# silenciosamente. Verificado: "Env var required but not provided".
#
# El +schema es el DOMINIO. Este proyecto es solo Sales; finance/marketing
# viven en sus propios proyectos dbt.
#
# En el IDE, macros/generate_schema_name.sql le antepone tu schema personal
# (DYLAN_SALES) para que nadie se pise. En los jobs queda literal (SALES).
# ---------------------------------------------------------------------------

models:
  adw_sales:
    bronze:
      +database: "{{ env_var('DBT_DB_ADW_BRONZE') }}"
      +schema: SALES
      +materialized: view
      +tags: ["bronze"]

    silver:
      +database: "{{ env_var('DBT_DB_ADW_SILVER') }}"
      +schema: SALES
      +materialized: table
      +tags: ["silver"]

    gold:
      +database: "{{ env_var('DBT_DB_ADW_GOLD') }}"
      +schema: SALES
      +materialized: view
      +tags: ["gold"]

    platinum:
      +database: "{{ env_var('DBT_DB_ADW_PLATINUM') }}"
      +schema: SALES
      +materialized: view
      +tags: ["gold"]